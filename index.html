<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diário de Treino — Gabriel Longarfino</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#252535;--bg4:#2e2e45;
  --accent:#6c63ff;--accent2:#a78bfa;--green:#22c55e;--green2:#16a34a;
  --text:#f0f0ff;--text2:#b0b0cc;--text3:#7777aa;
  --border:#35355a;--border2:#4a4a75;
  --card:#13131e;--card2:#1e1e2e;
  --r:12px;--r2:8px;--r3:20px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100dvh;}

/* HEADER */
.header{
  padding:env(safe-area-inset-top) 1rem 0;
  background:linear-gradient(180deg,#0f0f1a 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.header-inner{padding:.9rem 0 .75rem;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--text),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header p{font-size:12px;color:var(--text3);margin-top:2px;}
.header-right{display:flex;gap:8px;}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2);transition:.2s;}
.icon-btn:active{transform:scale(.92);background:var(--bg4);}

/* TREINO TABS */
.treino-tabs{display:flex;overflow-x:auto;gap:0;scrollbar-width:none;padding:0 .75rem;background:var(--bg2);border-bottom:1px solid var(--border);}
.treino-tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text3);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:.2s;}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent);}

/* SEMANA TABS */
.semana-row{display:flex;gap:6px;padding:.6rem .75rem;background:var(--bg2);border-bottom:1px solid var(--border);}
.sem-btn{flex:1;padding:6px 4px;font-size:12px;font-weight:600;background:var(--bg3);
  border:1px solid var(--border);border-radius:var(--r2);cursor:pointer;color:var(--text3);transition:.2s;}
.sem-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sem-btn:active{transform:scale(.95);}

/* PROGRESS */
.prog-wrap{padding:.6rem .75rem .4rem;background:var(--bg2);}
.prog-info{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px;}
.prog-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:10px;padding-bottom:6rem;}
.scroll::-webkit-scrollbar{width:3px;}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

/* EXERCISE CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:.2s;flex-shrink:0;}
.card-head{padding:.65rem .75rem;background:var(--card2);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
.ex-obs{font-size:11px;color:var(--text3);margin-top:2px;}
.badge{flex-shrink:0;font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;
  background:rgba(108,99,255,.2);color:var(--accent2);border:1px solid rgba(108,99,255,.3);white-space:nowrap;}

.card-labels{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:6px;padding:.4rem .75rem .1rem;
  font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center;}
.srows{padding:.1rem .75rem .4rem;display:flex;flex-direction:column;gap:6px;}
.srow{display:grid;grid-template-columns:32px 1fr 1fr 32px;gap:6px;align-items:center;}
.slbl{font-size:12px;font-weight:700;color:var(--text3);text-align:center;}
.sinp{width:100%;padding:8px 6px;font-size:15px;font-weight:600;text-align:center;
  border:2px solid var(--border2);border-radius:var(--r2);background:var(--bg3);color:var(--text);
  -moz-appearance:textfield;transition:.2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.4);}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none;}
.sinp:focus{outline:none;border-color:var(--accent);background:var(--bg4);box-shadow:0 0 0 3px rgba(108,99,255,.2);}
.chk-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);
  cursor:pointer;font-size:13px;color:var(--text3);transition:.2s;display:flex;align-items:center;justify-content:center;}
.chk-btn.done{background:rgba(34,197,94,.2);border-color:var(--green2);color:var(--green);}
.chk-btn:active{transform:scale(.88);}
.obs-inp{width:100%;margin:.25rem .75rem .6rem;width:calc(100% - 1.5rem);padding:6px 8px;font-size:12px;
  border:1px solid var(--border);border-radius:var(--r2);background:var(--bg2);color:var(--text2);
  resize:none;font-family:'Inter',sans-serif;display:block;transition:.2s;}
.obs-inp:focus{outline:none;border-color:var(--border2);}

/* SAVE BAR */
.save-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  padding:.75rem;padding-bottom:calc(.75rem + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 80%,transparent);display:flex;gap:8px;}
.save-btn{flex:1;padding:12px;font-size:14px;font-weight:700;font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--r);
  cursor:pointer;letter-spacing:.3px;transition:.2s;box-shadow:0 4px 20px rgba(108,99,255,.4);}
.save-btn:active{transform:scale(.97);box-shadow:0 2px 10px rgba(108,99,255,.3);}
.exp-btn{width:48px;padding:12px 0;font-size:18px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--r);cursor:pointer;color:var(--text2);transition:.2s;}
.exp-btn:active{transform:scale(.95);}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green2);color:#fff;padding:10px 20px;border-radius:var(--r3);
  font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <h1>💪 Diário de Treino</h1>
      <p>Gabriel Longarfino — 4 semanas</p>
    </div>
  </div>
</div>

<div class="treino-tabs" id="treinoTabs"></div>

<div class="semana-row" id="semanaTabs">
  <button class="sem-btn active" onclick="setSemana(0)">S1</button>
  <button class="sem-btn" onclick="setSemana(1)">S2</button>
  <button class="sem-btn" onclick="setSemana(2)">S3</button>
  <button class="sem-btn" onclick="setSemana(3)">S4</button>
</div>

<div class="prog-wrap">
  <div class="prog-info">
    <span id="pLbl">0/0 séries</span>
    <span id="pPct">0%</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
</div>

<div class="scroll" id="content"></div>

<div class="save-bar">
  <button class="save-btn" onclick="salvar()">💾 Salvar treino</button>
  <button class="exp-btn" onclick="exportar()" title="Exportar">⬇️</button>
</div>

<div class="toast" id="toast">✓ Treino salvo!</div>

<script src="app.js"></script>
<script>
// Render tabs after load
(function(){
  const nav=document.getElementById('treinoTabs');
  nav.innerHTML=TREINOS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" onclick="setTreino(${i})">${t.emoji} ${t.nome}</button>`).join('');
  renderTreino();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
})();
</script>
</body>
</html>
